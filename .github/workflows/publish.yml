name: Publish to NPM

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (ohne v, z.B. 0.1.50)'
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Extract version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_ENV
          else
            echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
          fi

      - name: Install dependencies
        run: npm install --no-audit --no-fund --quiet

      - name: Set version
        run: npm version ${{ env.VERSION }} --no-git-tag-version

      - name: Build
        run: npm run build

      - name: Debug OIDC
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Ref: ${{ github.ref }}"
          echo "Repo: ${{ github.repository }}"
          curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | \
            python3 -c "import sys,json; t=json.load(sys.stdin)['value']; import base64; print(json.loads(base64.b64decode(t.split('.')[1]+'==').decode()))"

      - name: Publish
        run: npm publish --provenance --access public