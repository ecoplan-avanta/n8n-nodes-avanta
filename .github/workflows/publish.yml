name: Publish to NPM

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Extract version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Install dependencies
        run: npm ci

      - name: Set version
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          if [ "$CURRENT_VERSION" != "${{ env.VERSION }}" ]; then
            npm version ${{ env.VERSION }} --no-git-tag-version
          else
            echo "Version already set to ${{ env.VERSION }}, skipping npm version"
          fi

      - name: Build
        run: npm run build

      - name: Publish to NPM
        run: npm publish --provenance

      - name: Extract Release Notes
        id: release_notes
        run: |
          # Extract release notes for this version from CHANGELOG.md
          if [ -f "CHANGELOG.md" ]; then
            NOTES=$(awk "/^## \[${{ env.VERSION }}\]/{flag=1; next} /^## \[/{flag=0} flag" CHANGELOG.md | head -50)
            if [ -z "$NOTES" ]; then
              NOTES="Release v${{ env.VERSION }} - See [CHANGELOG.md](CHANGELOG.md) for details."
            fi
          else
            NOTES="Release v${{ env.VERSION }}" 
          fi
          # Write to file for multiline support
          echo "$NOTES" > release_notes.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ env.VERSION }}
          body_path: release_notes.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}